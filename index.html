<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zorario - Bihar's No.1 Real Estate Platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zorario">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zorario</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: 'ITCBauhaus';
      src: url('./ITCBauhaus.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ── PRELOADER ─────────────────────────────────────────── */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0D1B2A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .preloader-logo {
      width: 72px; height: 72px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(74, 144, 164, 0.3);
      animation: preloaderPulse 1.4s ease-in-out infinite;
    }
    .preloader-text {
      font-family: 'ITCBauhaus', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      letter-spacing: 4px;
    }
    .preloader-bar-track {
      width: 180px; height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .preloader-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4A90A4, #6BB5CB);
      border-radius: 2px;
      animation: preloaderFill 1.6s ease forwards;
    }
    @keyframes preloaderPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74,144,164,0.4); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(74,144,164,0); }
    }
    @keyframes preloaderFill {
      from { width: 0; } to { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- ── PRELOADER ─────────────────────────────────────────────── -->
  <div id="preloader" role="status" aria-label="Loading Zorario">
      <img src="favicon.png" alt="Zorario" class="preloader-logo" width="72" height="72">
      <div class="preloader-text">ZORARIO</div>
      <div class="preloader-bar-track">
          <div class="preloader-bar-fill"></div>
      </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide preloader when the first frame of the Flutter app is rendered
    window.addEventListener('flutter-first-frame', function() {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.classList.add('hidden');
        setTimeout(() => preloader.remove(), 600);
      }
    });

    // Fallback: hide it after 8 seconds anyway in case something fails to load
    setTimeout(function() {
      const preloader = document.getElementById('preloader');
      if (preloader) {
        preloader.classList.add('hidden');
      }
    }, 8000);
  </script>
</body>
</html>
